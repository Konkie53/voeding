<!doctype html><html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voeding">
<meta name="theme-color" content="#dcd6ff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">

<title>Voeding</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: foodtracker. Lavendel kop met kcal-meter en macrobalken, daaronder een wit vel met pastel tegels per eetmoment; tik op een tegel voor het detailscherm. Vaste tabbalk met roze plusknop in het midden. */
:root {
  --bg: #ffffff;
  --zone: #dcd6ff;
  --hero: #9b8af2;
  --hero-ink: #ffffff;
  --ink: #1f1b30;
  --muted: #6f6a86;
  --line: #ecebf4;
  --soft: #f5f4fb;
  --fab: #f2639b;
  --done: #2f9e5d;
  --m-e: #f06595; --m-kh: #5cc98a; --m-v: #f5a04a;
  --p-lav: #ebe7ff;  --a-lav: #6c5ce0;
  --p-peach: #ffe6d5; --a-peach: #df6f26;
  --p-mint: #dcf4e5; --a-mint: #2f9e5d;
  --p-pink: #ffe1ec; --a-pink: #dc4479;
  --p-sky: #dcecff;  --a-sky: #2f7fd6;
  --p-butter: #fff2c6; --a-butter: #a87d00;
  --shadow: 0 8px 24px rgba(60, 45, 140, .08);
  --font: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --tabbar-h: 66px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15131f; --zone: #29244c; --hero: #5546c2; --hero-ink: #ffffff; --ink: #f1eff9; --muted: #a7a2bf;
    --line: #2a2739; --soft: #1e1b2c; --done: #5fd28e;
    --p-lav: #2b2650; --a-lav: #b4a9ff; --p-peach: #3a281c; --a-peach: #ffb27a; --p-mint: #1b3326; --a-mint: #6fd99a;
    --p-pink: #3b1f2c; --a-pink: #ff8db5; --p-sky: #1a2a41; --a-sky: #80b9ff; --p-butter: #3a3218; --a-butter: #f0cf5a;
    --shadow: 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15131f; --zone: #29244c; --hero: #5546c2; --hero-ink: #ffffff; --ink: #f1eff9; --muted: #a7a2bf;
  --line: #2a2739; --soft: #1e1b2c; --done: #5fd28e;
  --p-lav: #2b2650; --a-lav: #b4a9ff; --p-peach: #3a281c; --a-peach: #ffb27a; --p-mint: #1b3326; --a-mint: #6fd99a;
  --p-pink: #3b1f2c; --a-pink: #ff8db5; --p-sky: #1a2a41; --a-sky: #80b9ff; --p-butter: #3a3218; --a-butter: #f0cf5a;
  --shadow: 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 28px); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--a-lav); outline-offset: 2px; }
svg { display: block; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.c-lav { --tile: var(--p-lav); --tile-ink: var(--a-lav); }
.c-peach { --tile: var(--p-peach); --tile-ink: var(--a-peach); }
.c-mint { --tile: var(--p-mint); --tile-ink: var(--a-mint); }
.c-pink { --tile: var(--p-pink); --tile-ink: var(--a-pink); }
.c-sky { --tile: var(--p-sky); --tile-ink: var(--a-sky); }
.c-butter { --tile: var(--p-butter); --tile-ink: var(--a-butter); }

/* Kop */
.zone { background: var(--zone); margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 14px); padding-bottom: 40px; }
.zone .wrap { display: grid; gap: 16px; }
.toprow { display: grid; grid-template-columns: 42px 1fr 42px; align-items: center; gap: 8px; }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--hero); color: var(--hero-ink); display: grid; place-items: center; font-weight: 600; font-size: 17px; }
.datepill { justify-self: center; display: flex; align-items: center; gap: 4px; min-width: 0; }
.datepill .arrow { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
.datepill .arrow svg { width: 18px; height: 18px; }
.datepill .lbl { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 16px; white-space: nowrap; }
.datepill .lbl svg { width: 18px; height: 18px; }
.roundbtn { width: 42px; height: 42px; border-radius: 50%; background: color-mix(in srgb, var(--hero) 28%, transparent); display: grid; place-items: center; color: var(--ink); }
.roundbtn svg { width: 20px; height: 20px; }
.zonetitle { text-align: center; }
.zonetitle h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.zonetitle p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

.hero { background: var(--hero); color: var(--hero-ink); border-radius: 28px; padding: 18px 18px 16px; display: grid; grid-template-columns: 148px 1fr; gap: 14px; align-items: center; box-shadow: var(--shadow); }
.gauge { position: relative; width: 148px; height: 148px; }
.gauge svg { width: 148px; height: 148px; }
.gauge .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.gauge .big { font-size: 31px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.gauge .left { display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 12px; opacity: .9; margin-top: 4px; }
.gauge .left svg { width: 13px; height: 13px; }
.gauge .of { font-size: 11px; opacity: .75; margin-top: 18px; }
.macros { display: grid; gap: 12px; min-width: 0; }
.macro .r { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
.macro .r span:first-child { opacity: .85; }
.macro .r b { font-weight: 600; white-space: nowrap; }
.macro .r b small { font-weight: 400; opacity: .75; }
.mbar { height: 6px; border-radius: 999px; background: rgba(255,255,255,.28); margin-top: 5px; overflow: hidden; }
.mbar i { display: block; height: 100%; border-radius: 999px; transition: width .35s ease; }
.daytitle { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,.22); padding-top: 12px; font-size: 14px; }
.daytitle b { font-weight: 600; }
.todaybtn { background: rgba(255,255,255,.22); color: var(--hero-ink); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }

/* Wit vel */
.content { background: var(--bg); border-radius: 28px 28px 0 0; margin-top: -24px; position: relative; padding-top: 20px; }
.content > .wrap { display: grid; gap: 16px; }
.sechead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sechead h2 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
.sechead span { color: var(--muted); font-size: 13px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -2px; padding: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; align-items: center; gap: 7px; background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.chip svg { width: 16px; height: 16px; color: var(--a-lav); }
.chip select, .chip input { font: inherit; font-size: 14px; font-weight: 500; color: var(--ink); background: transparent; border: 0; padding: 2px 0; min-width: 0; }
.chip input[type="number"] { width: 4.2em; }
.banner { background: var(--p-butter); color: var(--ink); border-radius: 18px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.banner svg { width: 18px; height: 18px; flex: none; color: var(--a-butter); margin-top: 1px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { position: relative; background: var(--tile); border-radius: 24px; min-height: 168px; padding: 12px; overflow: hidden; display: flex; flex-direction: column; text-align: left; color: var(--ink); isolation: isolate; }
.tile .art { position: absolute; right: -14px; bottom: -10px; width: 96px; height: 96px; color: var(--tile-ink); opacity: .2; z-index: -1; }
.tile .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; min-height: 26px; }
.tag { display: inline-flex; align-items: center; gap: 4px; background: var(--bg); color: var(--tile-ink); border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 600; }
.tag svg { width: 12px; height: 12px; }
.tile h3 { margin: 10px 0 0; font-size: 18px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
.tile .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.tile .foot { margin-top: auto; padding-top: 12px; display: flex; justify-content: space-between; align-items: flex-end; gap: 6px; }
.kcal { display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.kcal svg { width: 13px; height: 13px; color: var(--a-peach); }
.count { font-size: 12px; color: var(--muted); margin-top: 6px; }
.quick { width: 38px; height: 38px; border-radius: 50%; background: var(--bg); color: var(--muted); display: grid; place-items: center; flex: none; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.quick svg { width: 18px; height: 18px; }
.tile.complete .quick { background: var(--done); color: #fff; }
.tile .opener { position: absolute; inset: 0; border-radius: 24px; z-index: 0; }
.tile .top, .tile h3, .tile .sub, .tile .foot { position: relative; z-index: 1; pointer-events: none; }
.tile .quick { pointer-events: auto; }
.tile.info-only .foot { display: none; }

.panel { background: var(--soft); border-radius: 22px; padding: 16px; display: grid; gap: 10px; }
.panel h3 { margin: 0; font-size: 18px; font-weight: 600; }
.panel p { margin: 0; }
.muted { color: var(--muted); font-size: 13.5px; }
.scale { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
.scale button { aspect-ratio: 1; border-radius: 10px; background: var(--bg); font-weight: 600; font-size: 15px; }
.scale button.sel { background: var(--a-lav); color: var(--bg); }
textarea, .field { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea { min-height: 64px; resize: vertical; }
.extras { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.extras li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; background: var(--bg); border-radius: 14px; padding: 8px 8px 8px 12px; }
.extras .x { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.extras .x svg { width: 16px; height: 16px; }

/* Week */
.days { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.dayrow { width: 100%; display: grid; grid-template-columns: 52px 1fr 54px; gap: 12px; align-items: center; text-align: left; background: var(--tile); border-radius: 22px; padding: 12px 14px; }
.dayrow.today { box-shadow: inset 0 0 0 2px var(--tile-ink); }
.dayrow .d { font-size: 22px; font-weight: 700; line-height: 1; color: var(--tile-ink); }
.dayrow .d small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 3px; }
.dayrow .t { min-width: 0; font-size: 14px; }
.dayrow .t b { display: block; font-weight: 600; font-size: 15px; }
.dayrow .t span { color: var(--muted); font-size: 12.5px; }
.ring { position: relative; width: 54px; height: 54px; }
.ring svg { width: 54px; height: 54px; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--bg); border-radius: 16px; padding: 12px 10px; }
.stat b { display: block; font-size: 22px; font-weight: 700; }
.stat span { font-size: 12px; color: var(--muted); }

/* Boodschappen en info */
.shopgroup { border-radius: 22px; padding: 14px 16px 6px; background: var(--tile); }
.shopgroup h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tile-ink); }
.shopgroup ul { list-style: none; margin: 0; padding: 0; }
.shopgroup li button { width: 100%; display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 10px 0; border-top: 1px solid color-mix(in srgb, var(--tile-ink) 14%, transparent); }
.shopgroup li:first-child button { border-top: 0; }
.shopgroup .sq { color: var(--muted); font-size: 13px; text-align: right; }
.shopgroup li.on .sn { color: var(--muted); text-decoration: line-through; }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--muted) 45%, transparent); display: grid; place-items: center; transition: background .15s, border-color .15s; flex: none; }
.check svg { width: 14px; height: 14px; color: #fff; opacity: 0; }
.on > .check, .on .check { background: var(--done); border-color: var(--done); }
.on > .check svg, .on .check svg { opacity: 1; }
.ghost { font-size: 14px; font-weight: 600; color: var(--a-lav); padding: 6px 0; }
ol.rules, ul.rules { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl td { border-top: 1px solid var(--line); padding: 9px 8px 9px 0; vertical-align: top; }
.tbl td:first-child { font-weight: 500; width: 42%; }
.sync { text-align: center; font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.dot.ok { background: var(--done); }

/* Tabbalk */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); box-shadow: 0 -6px 24px rgba(40,30,90,.07); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); align-items: center; }
.tab { display: grid; place-items: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--muted); height: 100%; }
.tab .ic { width: 42px; height: 30px; border-radius: 999px; display: grid; place-items: center; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .ic { background: var(--p-lav); color: var(--a-lav); }
.fab { justify-self: center; width: 62px; height: 62px; border-radius: 50%; background: var(--fab); color: #fff; display: grid; place-items: center; transform: translateY(-22px); box-shadow: 0 10px 24px color-mix(in srgb, var(--fab) 45%, transparent); }
.fab svg { width: 28px; height: 28px; }

/* Detail */
.detail { position: fixed; inset: 0; z-index: 15; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.dhead { background: var(--tile); height: calc(220px + env(safe-area-inset-top, 0px)); position: relative; display: grid; place-items: center; padding-top: env(safe-area-inset-top, 0px); overflow: hidden; }
.dhead .art { width: 150px; height: 150px; color: var(--tile-ink); opacity: .55; }
.dhead .back { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px)); width: 42px; height: 42px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
.dhead .back svg { width: 20px; height: 20px; }
.dhead .when { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 22px); right: max(16px, env(safe-area-inset-right, 0px)); }
.dbody { background: var(--bg); border-radius: 28px 28px 0 0; margin-top: -28px; position: relative; padding-top: 22px; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.dbody .wrap { display: grid; gap: 16px; }
.dbody h1 { margin: 0; text-align: center; font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
.dbody .sub { text-align: center; color: var(--muted); margin-top: -10px; }
.pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 500; background: var(--tile); color: var(--ink); }
.pill svg { width: 14px; height: 14px; color: var(--tile-ink); }
.rings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rcard { background: var(--tile); border-radius: 22px; padding: 14px 8px 12px; display: grid; justify-items: center; gap: 6px; }
.rcard .ringbig { position: relative; width: 76px; height: 76px; }
.rcard .ringbig svg { width: 76px; height: 76px; }
.rcard .ringbig div { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.rcard .ringbig b { font-size: 17px; font-weight: 600; }
.rcard .ringbig small { font-size: 11.5px; color: var(--tile-ink); font-weight: 500; }
.rcard > span { font-size: 13px; font-weight: 500; }
.dtabs { display: flex; border-bottom: 1px solid var(--line); }
.dtabs button { flex: 1; padding: 10px 4px; font-size: 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.dtabs button[aria-selected="true"] { color: var(--a-lav); border-bottom-color: var(--a-lav); }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 1fr auto; background: var(--soft); border-radius: 18px; overflow: hidden; }
.tick { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 12px 6px 12px 14px; min-height: 58px; min-width: 0; }
.iname { min-width: 0; }
.iname .n { display: block; font-weight: 500; }
.iname .was { display: block; font-size: 12px; color: var(--a-lav); }
.item.on .iname .n { color: var(--muted); text-decoration: line-through; }
.amt { text-align: right; font-weight: 600; white-space: nowrap; }
.amt small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); white-space: normal; max-width: 9em; margin-left: auto; }
.item.on .amt { color: var(--muted); }
.swap { width: 48px; display: grid; place-items: center; color: var(--muted); }
.swap svg { width: 20px; height: 20px; }
.item.swapped .swap { color: var(--a-lav); }
.item.info { grid-template-columns: 1fr; }
.item.info .tick { cursor: default; grid-template-columns: 26px 1fr; color: var(--muted); }
.item.info .check { border-style: dashed; }
.prep { background: var(--soft); border-radius: 18px; padding: 14px; font-size: 15px; display: grid; gap: 8px; }
.prep b { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--a-lav); }
.dfoot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 16; padding: 12px max(18px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.dfoot .in { max-width: 560px; margin: 0 auto; }
.btn { display: block; width: 100%; background: var(--a-lav); color: var(--bg); font-weight: 600; font-size: 16px; border-radius: 18px; padding: 15px; text-align: center; }
.btn.done { background: var(--done); color: #fff; }
.btn.sec { background: var(--soft); color: var(--ink); }

/* Vervang- en extra-paneel */
.sheet-bg { position: fixed; inset: 0; background: rgba(20,14,40,.45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 86vh; overflow-y: auto; border-radius: 28px 28px 0 0;
  padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }

  const UNITS = { sneetjes: ["snee", "sneetjes"], plakken: ["plak", "plakken"], bidons: ["bidon", "bidons"], stuks: ["stuk", "stuks"], minuten: ["minuut", "minuten"], bolletjes: ["bolletje", "bolletjes"] };
  const TILE_COLORS = ["c-lav", "c-peach", "c-mint", "c-pink", "c-sky", "c-butter"];

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };

  const keyOf = (s) => DAYKEYS[parse(s).getDay()];
  const mondayOf = (s) => { const d = parse(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
  const nlNum = (n) => String(n).replace(".", ",");
  const nl = (n) => Math.round(n).toLocaleString("nl-NL");
  const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  const fromMin = (m) => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ":" + pad(m % 60); };

  function fmtQ(q, u) {
    if (typeof q !== "number") return q || "";
    if (u === "g" || u === "ml") { const r = q < 30 ? Math.round(q) : Math.round(q / 5) * 5; return nlNum(r) + " " + u; }
    const r = Math.round(q * 2) / 2, whole = Math.floor(r), half = r - whole ? "½" : "";
    const txt = (whole ? String(whole) : "") + half || "0";
    const lbl = UNITS[u] ? (r <= 1 ? UNITS[u][0] : UNITS[u][1]) : u;

  function mealLook(name, sub) {
    const n = name.toLowerCase();
    if ((sub || "").toLowerCase() === "lunch") return ["sandwich", "c-mint"];
    if (n.includes("rustig fietsen")) return ["bike", "c-sky"];
    if (n.includes("tijdens het fietsen")) return ["bike", "c-sky"];
    if (n.includes("direct na het fietsen") || n.includes("na de finish")) return ["cup", "c-peach"];
    if (n.includes("ontbijt")) return ["bread", "c-lav"];

    if (n.includes("na het schaatsen") || n.includes("na het lostrappen")) return ["skate", "c-pink"];

  }

  let ui = { tab: "dag", date: todayStr(), meal: null, dtab: "prod" };
  try { const t = localStorage.getItem(LS_KEY + ".tab"); if (t) ui.tab = t; } catch (e) {}
  if (location.hash === "#week") ui.tab = "week";
  if (location.hash === "#boodschappen") ui.tab = "shop";
  if (location.hash === "#info") ui.tab = "info";
  let db = null, sync = "local";

  const persistLocal = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {} };
  const log = (date) => store.logs[date] || (store.logs[date] = { date, checked: {}, swaps: {} });

  // Wachtrij: één schrijfactie tegelijk per document. Doel: Claude-db (artifact) of de privé GitHub-datarepo (losse site).
  const GH_REPO = "Konkie53/voeding-data";
  let ghToken = null; try { ghToken = localStorage.getItem(LS_KEY + ".gh"); } catch (e) {}
  store.dirty = store.dirty || {};
  const ghSha = {}; let lastSync = null, linkMsg = "";
  const pending = new Map(), inflight = new Set(), timers = new Map();
  const target = () => (db ? "db" : ghToken ? "gh" : null);
  function queue(path, data) {

    pending.set(path, data); clearTimeout(timers.get(path));

  }
  function flush(path) {

    const job = t === "db" ? db.doc(path).set(JSON.parse(JSON.stringify(data))) : ghPut(path + ".json", data);

        else { sync = code === "auth" ? "auth" : "error"; renderSync(); }
      })
      .finally(() => { inflight.delete(path); if (pending.has(path)) flush(path); });
  }

      const [kind, id] = p.split("/"), d = (kind === "log" ? store.logs : store.shop)[id];

  // GitHub-opslag: één JSON-bestand per dag (log/2026-11-25.json) en per week voor boodschappen (shop/<maandag>.json)
  const b64enc = (s) => btoa(unescape(encodeURIComponent(s)));
  const b64dec = (s) => decodeURIComponent(escape(atob(s.replace(/\s/g, ""))));
  async function gh(method, path, body, token) {
    let r;
    try {
      r = await fetch("https://api.github.com/repos/" + GH_REPO + (path ? "/contents/" + path : ""), {
        method, cache: "no-store",

  async function ghGet(path) {

  }
  async function ghPut(path, data, retry) {
    if (ghSha[path] === undefined) await ghGet(path);
    const body = { message: "Bijgewerkt: " + path, content: b64enc(JSON.stringify(data, null, 1)) };
    if (ghSha[path]) body.sha = ghSha[path];
    const r = await gh("PUT", path, body);
    if ((r.status === 409 || r.status === 422) && !retry) { await ghGet(path); return ghPut(path, data, true); }

  const pulled = new Set();
  async function pullWeek(date) {
    if (target() !== "gh") return;

  async function connect() {

    const timer = setTimeout(() => { if (sync === "connecting") { sync = "error"; renderSync(); } }, 10000);
    const onErr = () => { clearTimeout(timer); sync = "error"; renderSync(); };
    const firstPush = new Set();
    const handle = (kind, prefix) => (snap) => {
      if (!snap.metadata.fromCache) {

          const ids = new Set(snap.docs.map((d) => d.id));

  // ---------- schema -> dag ----------
  function rawNut(p, q) {

  const sum4 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2], a[3] + b[3]];
  function periodsFor(date) {
    const k = keyOf(date);
    return (S.periodes || []).filter((p) => date >= p.van && date <= p.tot && (!p.dagen || p.dagen.includes(k)));
  }
  // Het weekschema dat op een datum geldt: de nieuwste uit S.weken met vanaf <= datum (en eventueel tot >= datum).
  // Dagen of blokken die een weekschema niet noemt, komen uit het basisschema.
  function weekFor(date) {
    let best = null;
    (S.weken || []).forEach((w) => { if (date >= w.vanaf && (!w.tot || date <= w.tot) && (!best || w.vanaf >= best.vanaf)) best = w; });

  }

  function buildDay(date) {
    const L = store.logs[date] || {};
    const W = weekFor(date);
    const dagen = Object.assign({}, S.dagen, (W && W.dagen) || {});
    const blokken = Object.assign({}, S.blokken, (W && W.blokken) || {});
    const per = periodsFor(date);
    const forced = per.find((p) => p.dag);
    const tpl = (L.tpl && dagen[L.tpl] ? L.tpl : null) || (forced && forced.dag) || keyOf(date);
    const def = dagen[tpl];
    const offset = def.start && L.start ? toMin(L.start) - toMin(def.start) : 0;
    const cacheKey = date + "|" + (W ? W.vanaf + W.naam : "basis") + "|" + tpl + "|" + offset;
    if (dayCache.has(cacheKey)) return dayCache.get(cacheKey);
    const seen = {};
    const mk = (prefix, r, scale) => {
      const [name, q, u, p, x, kind] = r;
      let id = prefix + "|" + name; seen[id] = (seen[id] || 0) + 1; if (seen[id] > 1) id += "#" + seen[id];
      return { id, name, q, u, p, x, kind: kind || "food", raw: rawNut(p, q), scale };
    };
    let meals = def.momenten.map((m) => {
      const raw = [].concat(m.b ? blokken[m.b] || [] : [], m.i || []);
      const shift = (t) => (t && offset && !m.vast ? fromMin(toMin(t) + offset) : t);
      return { w: m.w, sub: m.sub, t: shift(m.t), tot: shift(m.tot), items: raw.map((r) => mk(tpl + "|" + m.w, r, true)) };
    });
    per.forEach((p) => { if (p.extra) meals.push({ w: p.extra.w, items: p.extra.i.map((r) => mk("extra|" + p.extra.w, r, false)) }); });
    if (offset) meals.sort((a, b) => (a.t && b.t ? toMin(a.t) - toMin(b.t) : 0));
    // schalen zodat alles afgevinkt precies het dagtotaal uit het schema is
    let P = [0, 0, 0, 0];
    meals.forEach((m) => m.items.forEach((it) => { if (it.scale) P = sum4(P, it.raw); }));
    // Alleen schalen als het schema een dagtotaal heeft dat dicht bij de som van de producten ligt.
    const T0 = def.totaal || {};
    const fac = (t, p) => { if (!t || !p) return 1; const x = t / p; return x > 0.75 && x < 1.33 ? x : 1; };
    const f = [fac(T0.kcal, P[0]), fac(T0.eiwit, P[1]), fac(T0.kh, P[2]), fac(T0.kcal, P[0])];
    let T = [0, 0, 0, 0];
    meals.forEach((m) => {
      m.nut = [0, 0, 0, 0];
      m.items.forEach((it) => { it.n = it.scale ? it.raw.map((x, i) => x * f[i]) : it.raw; m.nut = sum4(m.nut, it.n); });
      T = sum4(T, m.nut);
    });
    const notes = def.notities || [];
    meals.forEach((m, i) => { m.idx = i; m.notes = notes.filter((n) => n.na === m.w); m.look = mealLook(m.w, m.sub); });
    const day = { date, tpl, def, dagen, week: W ? W.naam : null, meals, banners: per.map((p) => p.label).concat(W && W.notitie ? [W.notitie] : []), offset, T };
    dayCache.set(cacheKey, day);
    return day;
  }
  function stats(date) {
    const day = buildDay(date), L = store.logs[date] || {}, ch = L.checked || {};
    let n = 0, d = 0, E = [0, 0, 0, 0], mealsDone = 0;
    day.meals.forEach((m) => {
      const food = m.items.filter((i) => i.kind !== "info");
      let md = 0;
      food.forEach((it) => { n++; if (ch[it.id]) { d++; md++; E = sum4(E, it.n); } });
      m.done = md; m.total = food.length; m.complete = food.length > 0 && md === food.length;
      if (m.complete) mealsDone++;
    });
    (L.extra || []).forEach((x) => { E[0] += Number(x.kcal) || 0; });
    return { day, n, d, E, T: day.T, mealsDone, mealsTotal: day.meals.filter((m) => m.total).length };
  }

  function arcGauge(pct) {
    const r = 58, C = 2 * Math.PI * r, arc = C * 0.75, v = Math.max(0, Math.min(1, pct)) * arc;
    return '<svg viewBox="0 0 148 148" aria-hidden="true"><g transform="rotate(135 74 74)">' +
      '<circle cx="74" cy="74" r="' + r + '" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="13" stroke-linecap="round" stroke-dasharray="' + arc + ' ' + C + '"/>' +
      '<circle cx="74" cy="74" r="' + r + '" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-dasharray="' + (v < 0.5 ? 0.01 : v) + ' ' + C + '" style="transition:stroke-dasharray .4s ease"/>' +
      '</g></svg>';
  }
  function ring(pct, size, stroke, color, track) {
    const r = (size - stroke) / 2, C = 2 * Math.PI * r, v = Math.max(0, Math.min(1, pct)) * C;
    return '<svg viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true"><g transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')">' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + track + '" stroke-width="' + stroke + '"/>' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + (v < 0.5 ? 0.01 : v) + ' ' + C + '"/></g></svg>';
  }

        body +
      '</div></div>' +
      (m.total ? '<div class="dfoot"><div class="in"><button class="btn' + (m.complete ? " done" : "") + '" data-act="mealall" data-m="' + m.idx + '">' + (m.complete ? "Alles gegeten ✓" : "Alles gegeten") + '</button></div></div>' : '');
    $detail.hidden = false;
  }

  function render() {
    if (!S) return;
    renderZone(); renderTabs();
    ({ dag: renderDay, week: renderWeek, shop: renderShop, info: renderInfo }[ui.tab] || renderDay)();
    $view.insertAdjacentHTML("beforeend", '<p class="sync" id="sync"></p>');
    renderSync();
    renderDetail();
    document.body.style.overflow = ui.meal != null || !$sheet.hidden ? "hidden" : "";
  }

  // ---------- panelen ----------
  function findItem(id) {
    for (const m of buildDay(ui.date).meals) for (const it of m.items) if (it.id === id) return it;
    return null;
  }
  function showSheet(html) { $sheet.innerHTML = '<div class="sheet-bg" data-act="close"><div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>' + html + '</div></div>'; $sheet.hidden = false; document.body.style.overflow = "hidden"; }
  function closeSheet() { $sheet.hidden = true; $sheet.innerHTML = ""; document.body.style.overflow = ui.meal != null ? "hidden" : ""; }
  function openSwap(id) {
    const it = findItem(id); if (!it) return;
    const cur = (log(ui.date).swaps || {})[id];
    const alts = (it.p && S.vervangers[it.p]) || [];
    let h = '<h2>Vervang ' + esc(it.name.split(",")[0].toLowerCase()) + '</h2>' +
      (alts.length ? '<p class="muted">De hoeveelheden zijn omgerekend naar ongeveer dezelfde voedingswaarde.</p>' : '') +
      '<div class="opts"><button class="opt' + (!cur ? " sel" : "") + '" data-act="pick" data-i="-1"><span class="lbl">' + esc(it.name) + '<small>origineel uit het schema</small></span><b class="num">' + esc(fmtQ(it.q, it.u)) + '</b></button>';
    alts.forEach(([n, f, u], i) => {
      const a = typeof it.q === "number" ? fmtQ(it.q * f, u) : "";
      h += '<button class="opt' + (cur && cur.n === n && cur.a === a ? " sel" : "") + '" data-act="pick" data-i="' + i + '"><span class="lbl">' + esc(n) + '</span><b class="num">' + esc(a) + '</b></button>';
    });
    h += '</div><label class="muted" for="customin">Iets anders gegeten?</label><div class="row2"><input class="field" id="customin" type="text" placeholder="Bijv. 2 rijstwafels met honing" value="' + esc(cur && cur.custom ? cur.n : "") + '"><button class="btn inline" data-act="custom">Opslaan</button></div>' +
      '<button class="btn sec" data-act="close">Sluiten</button>';
    showSheet(h); $sheet.dataset.id = id;
  }
  function pick(i) {
    const id = $sheet.dataset.id, it = findItem(id); if (!it) return closeSheet();
    const L = log(ui.date); L.swaps = L.swaps || {}; L.checked = L.checked || {};
    if (i < 0) delete L.swaps[id];
    else { const [n, f, u] = S.vervangers[it.p][i]; L.swaps[id] = { n, a: typeof it.q === "number" ? fmtQ(it.q * f, u) : "" }; L.checked[id] = true; }
    saveLog(ui.date); closeSheet(); render();
  }
  function openExtra() {
    const now = new Date();
    showSheet('<h2>Buiten het schema gegeten</h2><p class="muted">Noteer wat je extra at. Geen schuldgevoel en niets compenseren: morgen eet je gewoon het schema.</p>' +
      '<label class="muted" for="exname">Wat at je?</label><input class="field" id="exname" type="text" placeholder="Bijv. 2 stroopwafels">' +
      '<div class="row2"><input class="field" id="exkcal" type="number" inputmode="numeric" min="0" max="3000" placeholder="kcal (mag leeg)"><input class="field" id="extime" type="time" value="' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + '" aria-label="Tijd"></div>' +
      '<button class="btn" data-act="extrasave">Opslaan bij ' + esc(dateLabel(ui.date).toLowerCase()) + '</button><button class="btn sec" data-act="close">Annuleren</button>');
  }

  function openTpl() {
    const day = buildDay(ui.date), std = keyOf(ui.date);
    showSheet('<h2>Ander dagschema</h2><p class="muted">Normaal kiest de app automatisch het schema van de dag. Schuift je training op, kies dan hier welk dagschema je vandaag volgt.</p><div class="opts">' +
      WEEKORDER.map((k) => '<button class="opt' + (k === day.tpl ? " sel" : "") + '" data-act="tplpick" data-k="' + k + '"><span class="lbl">' + NAMEN[k] + '<small>' + esc(day.dagen[k].titel) + '</small></span><b>' + (k === std ? "normaal" : "") + '</b></button>').join("") +
      '</div><button class="btn sec" data-act="close">Sluiten</button>');
  }

  // ---------- gebeurtenissen ----------
  function toggleMeal(idx) {
    const m = buildDay(ui.date).meals[idx]; if (!m) return;
    const L = log(ui.date); L.checked = L.checked || {};
    const food = m.items.filter((i) => i.kind !== "info");
    const all = food.every((i) => L.checked[i.id]);
    food.forEach((i) => { if (all) delete L.checked[i.id]; else L.checked[i.id] = true; });
    saveLog(ui.date); render();
  }
  const setTab = (t) => { ui.tab = t; ui.meal = null; try { localStorage.setItem(LS_KEY + ".tab", t); } catch (e) {} render(); window.scrollTo(0, 0); };

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const act = el.dataset.act;
    if (act === "close") { if (e.target === el || el.tagName === "BUTTON") closeSheet(); return; }
    if (act === "pick") return pick(Number(el.dataset.i));
    if (act === "custom") {
      const v = document.getElementById("customin").value.trim(), id = $sheet.dataset.id;
      const L = log(ui.date); L.swaps = L.swaps || {}; L.checked = L.checked || {};
      if (v) { L.swaps[id] = { n: v, a: "", custom: true }; L.checked[id] = true; } else delete L.swaps[id];
      saveLog(ui.date); closeSheet(); render(); return;
    }
    if (act === "fab") return openExtra();
    if (act === "tplsheet") return openTpl();
    if (act === "tplpick") {
      const L = log(ui.date), k = el.dataset.k;
      if (k === keyOf(ui.date)) delete L.tpl; else L.tpl = k;
      delete L.start; saveLog(ui.date); closeSheet(); render(); return;
    }
    if (act === "ghlink") { const v = (document.getElementById("ghtoken").value || "").trim(); if (!v) { linkMsg = "Plak eerst je token."; return render(); } return linkGithub(v); }
    if (act === "ghunlink") { ghToken = null; try { localStorage.removeItem(LS_KEY + ".gh"); } catch (er) {} linkMsg = ""; sync = "local"; render(); return; }
    if (act === "extrasave") {
      const n = document.getElementById("exname").value.trim(); if (!n) { document.getElementById("exname").focus(); return; }
      const k = parseInt(document.getElementById("exkcal").value, 10), t = document.getElementById("extime").value;
      const L = log(ui.date); L.extra = (L.extra || []).concat([{ n, kcal: isNaN(k) ? null : k, t }]);
      saveLog(ui.date); closeSheet(); if (ui.tab !== "dag") ui.tab = "dag"; render(); return;
    }
    if (act === "extradel") { const L = log(ui.date); L.extra = (L.extra || []).filter((_, i) => i !== Number(el.dataset.i)); saveLog(ui.date); render(); return; }
    if (act === "prev" || act === "next") { ui.date = addDays(ui.date, act === "prev" ? -1 : 1); render(); pullWeek(ui.date); return; }
    if (act === "prevweek" || act === "nextweek") { ui.date = addDays(ui.date, act === "prevweek" ? -7 : 7); render(); pullWeek(ui.date); return; }
    if (act === "today") { ui.date = todayStr(); render(); pullWeek(ui.date); return; }
    if (act === "goto") { ui.date = el.dataset.date; return setTab("dag"); }
    if (act === "tab") return setTab(el.dataset.tab);
    if (act === "open") { ui.meal = Number(el.dataset.m); ui.dtab = "prod"; render(); $detail.scrollTop = 0; return; }
    if (act === "closedetail") { ui.meal = null; render(); return; }
    if (act === "dtab") { ui.dtab = el.dataset.t; renderDetail(); return; }
    if (act === "mealall") return toggleMeal(Number(el.dataset.m));
    if (act === "tick") {
      const L = log(ui.date); L.checked = L.checked || {};
      if (L.checked[el.dataset.id]) delete L.checked[el.dataset.id]; else L.checked[el.dataset.id] = true;
      saveLog(ui.date); render(); return;
    }
    if (act === "swap") return openSwap(el.dataset.id);
    if (act === "maag") { const L = log(ui.date), v = Number(el.dataset.v); L.maag = L.maag === v ? null : v; saveLog(ui.date); render(); return; }
    if (act === "shop") {
      const wk = mondayOf(ui.date), D = store.shop[wk] || (store.shop[wk] = { week: wk, checked: {} }), n = el.dataset.n;
      if (D.checked[n]) delete D.checked[n]; else D.checked[n] = true;
      saveShop(wk); render(); return;
    }
    if (act === "shopreset") { const wk = mondayOf(ui.date); store.shop[wk] = { week: wk, checked: {} }; saveShop(wk); render(); return; }
  });
  document.addEventListener("change", (e) => {
    const el = e.target, act = el.dataset && el.dataset.act; if (!act) return;
    const L = log(ui.date);
    if (act === "start") { const def = buildDay(ui.date).def; if (!el.value || el.value === def.start) delete L.start; else L.start = el.value; saveLog(ui.date); render(); }
    if (act === "maagnote") { L.maagNotitie = el.value; saveLog(ui.date); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$sheet.hidden) closeSheet(); else if (ui.meal != null) { ui.meal = null; render(); }
  });
  // Schema laden; bij terugkomen in de app opnieuw ophalen, zodat een nieuw weekschema vanzelf verschijnt.
  const SCHEMA_KEY = LS_KEY + ".schema";
  let schemaLoadedAt = 0;
  function useSchema(json) {
    (json.weken || []).forEach((w) => { Object.assign(json.voeding = json.voeding || {}, w.voeding || {}); Object.assign(json.vervangers = json.vervangers || {}, w.vervangers || {}); });
    S = json; dayCache.clear();
  }
  function loadSchema(first) {
    return fetch("schema.json?t=" + Date.now(), { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then((txt) => {
        schemaLoadedAt = Date.now();
        const changed = !S || txt !== (S && S.__raw);
        if (changed) { const json = JSON.parse(txt); json.__raw = txt; useSchema(json); try { localStorage.setItem(SCHEMA_KEY, txt); } catch (e) {} render(); }
        if (first) connect();
      })
      .catch(() => {
        if (first) {
          let cached = null; try { cached = localStorage.getItem(SCHEMA_KEY); } catch (e) {}
          if (cached) { const json = JSON.parse(cached); json.__raw = cached; useSchema(json); render(); connect(); }
          else $view.innerHTML = '<div class="panel"><h3>Het schema kon niet laden</h3><p class="muted">Controleer je verbinding en open de app opnieuw.</p></div>';
        }
      });
  }
  let lastToday = todayStr();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || !S) return;
    if (todayStr() !== lastToday) { if (ui.date === lastToday) ui.date = todayStr(); lastToday = todayStr(); render(); }
    if (Date.now() - schemaLoadedAt > 60000) loadSchema(false);
    if (target() === "gh") { pulled.delete(mondayOf(ui.date)); flushDirty(); pullWeek(ui.date); }
  });
  window.addEventListener("online", () => { if (target()) flushDirty(); });
  loadSchema(true);
})();
</script>

</body></html>
